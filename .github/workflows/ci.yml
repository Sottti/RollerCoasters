name: Android CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ github.job }}-${{ runner.os }}-
            gradle-${{ runner.os }}-
      - name: Setup local.properties with Maps API Key
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
      - name: Check Module Boundaries
        run: ./gradlew checkModuleDependencyBoundaries --stacktrace --no-daemon
      - name: Run Static Analysis
        run: ./gradlew detekt lintDebug --stacktrace --no-daemon
      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/paparazzi/failures/**
          if-no-files-found: ignore

  jvm-tests:
    name: JVM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build

    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: external
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ github.job }}-${{ runner.os }}-
            gradle-${{ runner.os }}-
      - name: Setup local.properties with Maps API Key
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
      - name: Run JVM Tests and Generate Kover Coverage
        run: ./gradlew test :koverXmlReport -PexcludeSnapshotTests=true --stacktrace --no-daemon
      - name: Verify Paparazzi Snapshots
        run: ./gradlew verifyPaparazziDebug --no-parallel --stacktrace --no-daemon

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/paparazzi/failures/**
          if-no-files-found: ignore
